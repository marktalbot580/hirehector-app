<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9B2C26">
<meta name="robots" content="noindex,nofollow">
<title>HireHector: your booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{padding-bottom:40px}
.cwrap{max-width:560px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:16px}
.sigbox{border:1px solid #8C8374;border-radius:10px;background:#FBF8F1;touch-action:none;width:100%;height:170px;display:block}
.terms{font-size:14px;line-height:1.55}
.terms li{margin:0 0 8px}
.big{font-size:17px}
.ok{background:#E3F1E6;border:1px solid #B5D8BC;color:#1F5A2D}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.chk input{width:22px;height:22px;margin-top:2px;flex:0 0 auto}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
</style>
</head>
<body>
<div id="app" class="cwrap"><div class="sub">Loading...</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script>
<script src="pdf.js"></script>
<script src="client.js"></script>
</body>
</html>
